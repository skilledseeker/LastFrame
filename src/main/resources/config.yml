  prefix: "&8[&cLastFrame&8] "
  offer: "&c☠ &fYou were killed by {killer}&f. "
  offer-button: "&a&l[▶ WATCH REPLAY]"
  offer-hover: "&7Watch the last &f{seconds}s &7of the fight\n&7from any angle."
  offer-key-hint: " &7or press &f{key}"
  offer-bar: "&a▶ &fDeath replay ready &8• &7click it in chat or press &f{key} &8• &e{seconds}s"
  offer-bar-no-key: "&a▶ &fDeath replay ready &8• &7click it in chat &8• &e{seconds}s"
  offer-dropped: "&7Replay discarded: you're in a fight."
  death-title: "&c&lYou Died!"
